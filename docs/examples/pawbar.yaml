# pawbar example configuration
# ~/.config/pawbar/pawbar.yaml

bar:
  gap: " "                # breathing room between adjacent modules
                          # (a `gap` entry overrides it at one join)
  truncate_priority: [right, left, middle]
  ellipsis: "…"
  # strict: true          # fail hard on any config error (also: pawbar --strict)
  outputs: all            # a bar on every monitor; or [eDP-1, HDMI-A-1]

theme:
  vars:
    accent: "#7aa2f7"
    warn: "#e0af68"
  defaults:               # applies to every module; entries override
    fg: "#c0caf5"
    states:
      hover: { bold: true }   # bar-wide hover styling

left:
  - ws
  - gap: " │ "            # a divider instead of the usual gap

right:
  - volume:
      format: "{icon} {vol}%"
      states:
        muted: { fg: "@warn", format: "{icon} --" }
      on:
        left: toggle-mute
        scroll-up: volume-up
        scroll-down: volume-down
  - gap: " │ "
  - clock:
      format: "{time:%H:%M}"
      states:
        full: { format: "{time:%A %d %B %H:%M:%S}" }
        hover: { fg: "@accent" }
      on:
        left: { cycle: [full] }
        right: { run: "gnome-calendar" }

# Per-monitor overrides. Keys are output names (hyprctl monitors,
# swaymsg -t get_outputs); each takes the same shape as the document
# above. Sides are replaced, bar and theme merge key by key.
#
# outputs:
#   HDMI-A-1:
#     left:
#       - ws:
#           monitor: all      # this bar lists every workspace
#     right:
#       - clock:
#           format: "{time:%H:%M}"
